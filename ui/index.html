<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>shop floor — shopkeeper</title>
<style>
  /* The scene is pixel art on a 704x252 canvas, scaled by whole numbers.
     Every piece of text is DOM on top of it, so ids and prices stay sharp
     at any zoom and can be selected. Nothing here owns shop logic.

     Three bands, nothing else: controls, the room, the metrics. The per-turn
     trace lives in Phoenix, which is where you go to read a span. */

  :root {
    color-scheme: dark;
    --bg:      #080b12;
    --panel:   #0f1522;
    --panel-2: #141b2b;
    --line:    #1f293e;
    --line-hi: #334765;
    --text:    #dde5f4;
    --mute:    #8495b0;
    --faint:   #5a6880;

    --llm:   #4d9bf0;
    --guide: #e3a948;
    --buy:   #a98bf0;
    --sold:  #35c98b;
    --out:   #f2705f;
    --err:   #f2705f;

    --mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, monospace;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, sans-serif;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    font-size: 15px;
    -webkit-font-smoothing: antialiased;
  }

  body {
    display: grid;
    grid-template-rows: auto minmax(0, 1fr) auto;
    gap: 12px;
    padding: 12px;
    overflow: hidden;
  }

  /* ---------- shared panel ---------- */

  .panel {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 12px;
    position: relative;
  }
  .panel::before {
    content: "";
    position: absolute;
    inset: 0 0 auto 0;
    height: 1px;
    background: linear-gradient(90deg, transparent, #ffffff14 30%, #ffffff10 70%, transparent);
    border-radius: 12px 12px 0 0;
    pointer-events: none;
  }

  .label {
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--faint);
  }

  /* ---------- top bar ---------- */

  #top {
    display: flex;
    align-items: center;
    gap: 14px 26px;
    padding: 16px 20px;
    flex-wrap: wrap;
  }

  .brand {
    display: flex;
    align-items: baseline;
    gap: 12px;
    margin-right: auto;
    min-width: 0;
  }
  .brand h1 {
    margin: 0;
    font-size: 24px;
    font-weight: 650;
    letter-spacing: -0.015em;
    white-space: nowrap;
  }
  .brand .sub {
    font-family: var(--mono);
    font-size: 13px;
    color: var(--faint);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .live {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    font-family: var(--mono);
    font-size: 14px;
    color: var(--mute);
    padding: 6px 14px 6px 11px;
    border: 1px solid var(--line);
    border-radius: 999px;
    background: var(--panel-2);
    white-space: nowrap;
  }
  .live i {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--sold);
    box-shadow: 0 0 0 4px #35c98b22;
  }
  .live[data-mode="tape"] i { background: var(--guide); box-shadow: 0 0 0 4px #e3a94822; }
  .live[data-mode="down"] i { background: var(--out);   box-shadow: 0 0 0 4px #f2705f22; }

  /* ---------- sliders ---------- */

  .control { min-width: 170px; flex: 1 1 250px; max-width: 320px; }
  .control .head {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 12px;
    margin-bottom: 8px;
  }
  .control .head b {
    font-family: var(--mono);
    font-size: 21px;
    font-weight: 600;
    color: var(--text);
    line-height: 1;
  }
  .control .head b small {
    color: var(--faint);
    font-weight: 400;
    font-size: 13px;
    margin-left: 3px;
  }

  input[type="range"] {
    -webkit-appearance: none;
    appearance: none;
    display: block;
    width: 100%;
    height: 22px;
    margin: 0;
    background: transparent;
    cursor: pointer;
  }
  input[type="range"]::-webkit-slider-runnable-track {
    height: 7px;
    border-radius: 4px;
    background: linear-gradient(90deg, var(--llm) var(--fill, 50%), #ffffff14 var(--fill, 50%));
  }
  input[type="range"]::-moz-range-track {
    height: 7px;
    border-radius: 4px;
    background: #ffffff14;
  }
  input[type="range"]::-moz-range-progress {
    height: 7px;
    border-radius: 4px;
    background: var(--llm);
  }
  input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none;
    appearance: none;
    width: 19px; height: 19px;
    margin-top: -6px;
    border-radius: 50%;
    background: #eef4ff;
    border: 4px solid #1b4a86;
    box-shadow: 0 1px 4px #0009;
  }
  input[type="range"]::-moz-range-thumb {
    width: 19px; height: 19px;
    border-radius: 50%;
    background: #eef4ff;
    border: 4px solid #1b4a86;
  }
  input[type="range"]:focus-visible { outline: 2px solid var(--llm); outline-offset: 3px; }

  .ticks {
    display: flex;
    justify-content: space-between;
    font-family: var(--mono);
    font-size: 11.5px;
    color: var(--faint);
    margin-top: 2px;
  }

  /* ---------- stage ---------- */

  #stage {
    overflow: hidden;
    display: grid;
    place-items: center;
    min-height: 0;
    background:
      radial-gradient(130% 90% at 50% 8%, #1a1408 0%, transparent 62%),
      var(--panel);
  }

  #frame {
    display: inline-block;
    position: relative;
    line-height: 0;
    /* set in px by JS so the pixel grid lands on whole device pixels */
  }

  canvas {
    display: block;
    image-rendering: pixelated;
    image-rendering: crisp-edges;
    border-radius: 4px;
  }

  #overlay {
    position: absolute;
    inset: 0;
    line-height: 1.35;
    pointer-events: none;
  }

  /* speech + ask bubbles, positioned in % of the native canvas box */
  .bub {
    position: absolute;
    transform: translate(-50%, -100%);
    width: max-content;
    max-width: min(30%, 420px);
    min-width: 72px;
    padding: 8px 12px 9px;
    border-radius: 9px;
    font-size: 16px;
    line-height: 1.32;
    letter-spacing: -0.005em;
    background: #f6f3ec;
    color: #1d1811;
    box-shadow: 0 2px 0 #0006, 0 8px 18px #0008;
    pointer-events: auto;
  }
  .bub::after {
    content: "";
    position: absolute;
    left: calc(50% + var(--tail, 0px));
    bottom: -7px;
    width: 14px; height: 8px;
    transform: translateX(-50%);
    background: inherit;
    clip-path: polygon(0 0, 100% 0, 50% 100%);
  }
  .bub.ask {
    background: #222c42;
    color: #d5e1f5;
    box-shadow: 0 2px 0 #0007, 0 8px 18px #0007;
    font-size: 15px;
  }
  .bub .turnof {
    display: block;
    font-family: var(--mono);
    font-size: 11px;
    color: #7a8aa6;
    margin-bottom: 2px;
  }
  .bub.say.sold  { box-shadow: 0 2px 0 #0006, 0 0 0 2px var(--sold), 0 8px 18px #0008; }
  .bub.say.out   { box-shadow: 0 2px 0 #0006, 0 0 0 2px var(--out),  0 8px 18px #0008; }
  .bub.say.error { box-shadow: 0 2px 0 #0006, 0 0 0 2px var(--err),  0 8px 18px #0008; }

  /* worker name plates under the counter */
  .plate {
    position: absolute;
    transform: translate(-50%, 0);
    font-family: var(--mono);
    font-size: 12.5px;
    letter-spacing: 0.06em;
    color: var(--mute);
    background: #0b101bcc;
    border: 1px solid var(--line);
    border-radius: 5px;
    padding: 2px 8px;
    white-space: nowrap;
  }
  .plate.busy { color: #cfe0f8; border-color: var(--line-hi); }
  .plate.busy .dot { color: var(--llm); }
  .plate .dot { color: var(--faint); }
  .plate.off { opacity: 0.35; }

  /* the thinking chip above a working shopkeeper */
  .chip {
    position: absolute;
    transform: translate(-50%, -100%);
    font-family: var(--mono);
    font-size: 12.5px;
    padding: 3px 10px;
    border-radius: 999px;
    white-space: nowrap;
    background: #0d1422ee;
    border: 1px solid var(--line-hi);
    color: var(--mute);
  }
  .chip.llm   { border-color: #2d558a; color: #9fc6f5; }
  .chip.guide { border-color: #6d5420; color: #eccb82; }
  .chip.buy   { border-color: #503f80; color: #c5b1f7; }
  .chip .el { color: var(--faint); margin-left: 6px; }

  .queuetag {
    position: absolute;
    transform: translate(-50%, -100%);
    width: max-content;
    font-family: var(--mono);
    font-size: 12.5px;
    color: #9fb0c9;
    background: #0a0f1ae8;
    border: 1px solid var(--line);
    border-radius: 5px;
    padding: 2px 7px;
    white-space: nowrap;
  }

  /* ---------- metric strip ---------- */

  #strip {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
    gap: 12px;
  }
  .card { padding: 14px 18px 15px; min-width: 0; }
  .card .top {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 10px;
  }
  .card .val {
    font-family: var(--mono);
    font-size: 34px;
    font-weight: 600;
    letter-spacing: -0.025em;
    line-height: 1.05;
    margin-top: 8px;
  }
  .card .val s { text-decoration: none; font-size: 16px; color: var(--faint); font-weight: 400; }
  .card svg { display: block; width: 100%; height: 40px; margin-top: 8px; overflow: visible; }
  .card .note {
    font-family: var(--mono);
    font-size: 12px;
    color: var(--faint);
    margin-top: 8px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  /* queue depth pips */
  .pips { display: flex; gap: 4px; margin-top: 12px; }
  .pips i {
    flex: 1;
    height: 28px;
    border-radius: 3px;
    background: #ffffff10;
    box-shadow: inset 0 0 0 1px #ffffff08;
  }
  .pips i.on   { background: var(--llm); }
  .pips i.hot  { background: var(--guide); }
  .pips i.full { background: var(--out); }

  /* outcome bars */
  .mix { display: grid; gap: 7px; margin-top: 11px; }
  .mix div { display: flex; align-items: center; gap: 10px; font-family: var(--mono); font-size: 14px; }
  .mix div span:first-child { width: 48px; color: var(--mute); }
  .mix div u { flex: 1; height: 8px; border-radius: 4px; background: #ffffff10; text-decoration: none; overflow: hidden; display: block; }
  .mix div u b { display: block; height: 100%; border-radius: 4px; }
  .mix div span:last-child { width: 32px; text-align: right; color: var(--text); font-weight: 600; }

  /* ---------- narrow ---------- */

  @media (max-width: 760px) {
    body {
      grid-template-rows: auto minmax(300px, 1fr) auto;
      overflow: auto;
    }
    #top { gap: 18px; }
    .brand { width: 100%; }
    .control { flex: 1 1 200px; min-width: 190px; }
  }
</style>
</head>
<body>

<header id="top" class="panel">
  <div class="brand">
    <h1>shop floor</h1>
    <span class="sub" id="model">—</span>
  </div>

  <span class="live" id="live" data-mode="tape"><i></i><span id="live-text">tape</span></span>

  <div class="control">
    <div class="head">
      <label class="label" for="staff">Staff</label>
      <b id="staff-val">2<small>/3</small></b>
    </div>
    <input id="staff" type="range" min="1" max="3" step="1" value="2">
    <div class="ticks"><span>1</span><span>2</span><span>3</span></div>
  </div>

  <div class="control">
    <div class="head">
      <label class="label" for="arrival">Arrivals</label>
      <b id="arrival-val">4<small>/min</small></b>
    </div>
    <input id="arrival" type="range" min="1" max="12" step="1" value="4">
    <div class="ticks"><span>slow</span><span>normal</span><span>rush</span></div>
  </div>
</header>

<main id="stage" class="panel">
  <div id="frame">
    <canvas id="shop" width="704" height="252" aria-label="The shop floor"></canvas>
    <div id="overlay"></div>
  </div>
</main>

<section id="strip">
  <div class="card panel">
    <div class="top"><span class="label">p95 turn</span><span class="label" id="lat-src">—</span></div>
    <div class="val" id="lat">0.0<s>s</s></div>
    <svg id="lat-spark" viewBox="0 0 100 24" preserveAspectRatio="none" aria-hidden="true"></svg>
  </div>

  <div class="card panel">
    <div class="top"><span class="label">tokens / min</span></div>
    <div class="val" id="tok">0</div>
    <svg id="tok-spark" viewBox="0 0 100 24" preserveAspectRatio="none" aria-hidden="true"></svg>
  </div>

  <div class="card panel">
    <div class="top"><span class="label">line</span><span class="label" id="drop">0 turned away</span></div>
    <div class="val" id="depth">0<s>/8 waiting</s></div>
    <div class="pips" id="pips"></div>
  </div>

  <div class="card panel">
    <div class="top"><span class="label">outcomes</span><span class="label" id="turns-n">0 turns</span></div>
    <div class="mix" id="mix">
      <div><span>sold</span><u><b style="background:var(--sold);width:0"></b></u><span>0</span></div>
      <div><span>guide</span><u><b style="background:var(--guide);width:0"></b></u><span>0</span></div>
      <div><span>out</span><u><b style="background:var(--out);width:0"></b></u><span>0</span></div>
    </div>
  </div>

  <div class="card panel">
    <div class="top"><span class="label">duckdb calls</span><span class="label">one process</span></div>
    <div class="val" id="calls">0<s>guide</s> <span id="buys" style="color:var(--buy)">0</span><s>buy</s></div>
    <div class="note" id="shelf-note">the shelf is the only writer</div>
  </div>
</section>

<script src="shop.js"></script>
</body>
</html>
