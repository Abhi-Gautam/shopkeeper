<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Shop floor</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: #070b14;
      color: #d7e2f0;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    }
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    #stage {
      position: relative;
      width: min(100vw, calc(100vh * 16 / 9));
      height: min(100vh, calc(100vw * 9 / 16));
      background: #070b14;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      background: #12182a;
    }
    .hud {
      position: absolute;
      left: 1.25%;
      right: 1.25%;
      top: 1.5%;
      height: 18.5%;
      display: flex;
      gap: 1.25%;
      pointer-events: none;
    }
    .panel {
      pointer-events: auto;
      flex: 1;
      background: #0c1424;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 0 3.2%;
      box-sizing: border-box;
    }
    .panel label {
      display: flex;
      justify-content: space-between;
      font-size: clamp(11px, 1.35vw, 15px);
      letter-spacing: 0.04em;
      color: #9eb0c8;
      margin-bottom: 0.15em;
    }
    .panel label b {
      color: #e8f0ff;
      font-weight: 600;
    }
    input[type="range"] {
      -webkit-appearance: none;
      appearance: none;
      width: 100%;
      height: 8px;
      margin: 0.4em 0 0.2em;
      background: #1a2740;
      outline: none;
      border: 2px solid #2a3d5c;
      cursor: pointer;
    }
    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 14px;
      height: 18px;
      background: #5aa7ff;
      border: 2px solid #d7ecff;
      cursor: pointer;
    }
    input[type="range"]::-moz-range-thumb {
      width: 14px;
      height: 18px;
      background: #5aa7ff;
      border: 2px solid #d7ecff;
      border-radius: 0;
      cursor: pointer;
    }
    .ticks {
      display: flex;
      justify-content: space-between;
      font-size: clamp(10px, 1.2vw, 13px);
      color: #7f93ad;
      margin-top: 0.15em;
    }
  </style>
</head>
<body>
  <div id="stage">
    <canvas id="shop" width="960" height="540"></canvas>
    <div class="hud">
      <div class="panel">
        <label for="staff">Staff <b id="staff-val">2</b></label>
        <input id="staff" type="range" min="1" max="3" step="1" value="2">
        <div class="ticks"><span>1</span><span>2</span><span>3</span></div>
      </div>
      <div class="panel">
        <label for="arrival">Arrivals <b id="arrival-val">4</b></label>
        <input id="arrival" type="range" min="1" max="12" step="1" value="4">
        <div class="ticks"><span>Slow</span><span>Normal</span><span>Rush</span></div>
      </div>
    </div>
  </div>
  <script src="shop.js"></script>
</body>
</html>
