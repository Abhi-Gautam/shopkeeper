<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 270" role="img" aria-labelledby="after-title after-desc" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#111">
  <title id="after-title">How a sale works now</title>
  <desc id="after-desc">A customer message goes to the model, which searches with guide. When one product fits what the customer named, the model calls buy straight away. The counter prints the receipt itself. Only if the customer asked something else in the same message does the model get called again, to answer just that part. A sale takes two model calls.</desc>
  <defs>
    <marker id="a-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#111"/>
    </marker>
  </defs>
  <g stroke="#111" stroke-width="1.5">
    <rect x="10" y="60" width="92" height="56" rx="4" fill="none"/>
    <rect x="118" y="60" width="92" height="56" rx="4" fill="#dbe8fa"/>
    <rect x="226" y="60" width="92" height="56" rx="4" fill="none"/>
    <rect x="334" y="60" width="92" height="56" rx="4" fill="#dbe8fa"/>
    <rect x="442" y="60" width="92" height="56" rx="4" fill="none"/>
    <rect x="550" y="60" width="92" height="56" rx="4" fill="none"/>
    <rect x="658" y="60" width="92" height="56" rx="4" fill="none"/>
    <rect x="550" y="168" width="200" height="56" rx="4" fill="#dbe8fa" stroke-dasharray="5 4"/>
  </g>
  <g fill="none" stroke="#111" stroke-width="1.5" marker-end="url(#a-arrow)">
    <line x1="102" y1="88" x2="114" y2="88"/>
    <line x1="210" y1="88" x2="222" y2="88"/>
    <line x1="318" y1="88" x2="330" y2="88"/>
    <line x1="426" y1="88" x2="438" y2="88"/>
    <line x1="534" y1="88" x2="546" y2="88"/>
    <line x1="642" y1="88" x2="654" y2="88"/>
    <line x1="596" y1="116" x2="596" y2="164" stroke-dasharray="5 4"/>
    <line x1="704" y1="168" x2="704" y2="120" stroke-dasharray="5 4"/>
  </g>
  <g text-anchor="middle">
    <text x="56" y="84">customer</text>
    <text x="56" y="102">message</text>
    <text x="164" y="84">model</text>
    <text x="164" y="102" fill="#555">search?</text>
    <text x="272" y="84">guide</text>
    <text x="272" y="102" fill="#555">rows</text>
    <text x="380" y="84">model</text>
    <text x="380" y="102" fill="#555">fits: sell</text>
    <text x="488" y="84">buy</text>
    <text x="488" y="102" fill="#555">sold</text>
    <text x="596" y="84">receipt</text>
    <text x="596" y="102" fill="#555">printed</text>
    <text x="704" y="84">reply</text>
    <text x="650" y="192">model</text>
    <text x="650" y="210" fill="#555">answers only the rest</text>
  </g>
  <text x="606" y="146" fill="#555" font-size="12">asked more?</text>
  <rect x="10" y="20" width="12" height="12" rx="2" fill="#dbe8fa" stroke="#111" stroke-width="1"/>
  <text x="30" y="30.5" fill="#333">model call</text>
  <text x="10" y="166" fill="#555">A named product is an order.</text>
  <text x="10" y="186" fill="#555">A sale takes two model calls.</text>
  <text x="10" y="206" fill="#555">The receipt is printed, not written.</text>
  <text x="10" y="252" fill="#555">"...and do you deliver?" goes to the model after the sale, on its own.</text>
</svg>
