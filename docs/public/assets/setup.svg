<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" role="img" aria-labelledby="setup-title setup-desc" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#111">
  <title id="setup-title">Shopkeeper setup</title>
  <desc id="setup-desc">Customer conversations go to the runner, which sends each line to the counter. The counter calls the model through the OpenAI Agents SDK and calls the guide and buy tools on a DuckDB MCP server. Traces and scores go to Phoenix, and the runner can also draw the shop floor page.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#111"/>
    </marker>
  </defs>
  <g fill="none" stroke="#111" stroke-width="1.5">
    <rect x="20" y="40" width="150" height="56" rx="4"/>
    <rect x="250" y="40" width="170" height="56" rx="4"/>
    <rect x="500" y="40" width="240" height="56" rx="4"/>
    <rect x="250" y="160" width="170" height="56" rx="4"/>
    <rect x="500" y="160" width="240" height="56" rx="4"/>
    <rect x="20" y="250" width="150" height="56" rx="4"/>
    <rect x="250" y="250" width="170" height="56" rx="4"/>
  </g>
  <g fill="none" stroke="#111" stroke-width="1.5" marker-end="url(#arrow)">
    <line x1="170" y1="68" x2="246" y2="68"/>
    <line x1="335" y1="96" x2="335" y2="156"/>
    <line x1="420" y1="176" x2="496" y2="176"/>
    <line x1="420" y1="200" x2="496" y2="200"/>
    <line x1="380" y1="160" x2="560" y2="100"/>
    <line x1="250" y1="68" x2="95" y2="246" stroke-dasharray="4 4"/>
    <line x1="335" y1="216" x2="335" y2="246"/>
  </g>
  <g text-anchor="middle">
    <text x="95" y="64">100 customers</text>
    <text x="95" y="82" fill="#555">conversations</text>
    <text x="335" y="64">runner</text>
    <text x="335" y="82" fill="#555">fresh shelf per run</text>
    <text x="620" y="64">gpt-6-luna</text>
    <text x="620" y="82" fill="#555">OpenAI Responses API</text>
    <text x="335" y="184">counter</text>
    <text x="335" y="202" fill="#555">4 model calls max</text>
    <text x="620" y="184">shelf</text>
    <text x="620" y="202" fill="#555">DuckDB MCP server</text>
    <text x="95" y="274">shop floor page</text>
    <text x="95" y="292" fill="#555">optional view</text>
    <text x="335" y="274">Phoenix</text>
    <text x="335" y="292" fill="#555">traces, scores</text>
  </g>
  <g fill="#555" font-size="12">
    <text x="458" y="170" text-anchor="middle">guide</text>
    <text x="458" y="214" text-anchor="middle">buy</text>
    <text x="520" y="142" text-anchor="middle">model calls</text>
    <text x="200" y="60" text-anchor="middle">lines</text>
    <text x="150" y="160" text-anchor="middle">events</text>
  </g>
</svg>
