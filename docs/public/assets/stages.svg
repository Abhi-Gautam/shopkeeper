<title id="stages-title">Every version of the shopkeeper</title>
<desc id="stages-desc">Every version on the same 33 customers. Customers who got the right order: 7, 6, 8 on the small shop, 7 with the item list on the full shelf, 23 with ranked search, 29 with ranked search and a printed receipt. Median seconds per customer: 5.7, 6.6, 6.7, 9.3, 5.7, 5.1. Cost for the 33 customers: $0.006, $0.026, $0.027, $0.146, $0.010, $0.011.</desc>
