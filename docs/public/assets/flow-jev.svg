<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 290" role="img" aria-labelledby="jev-title jev-desc" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#111">
  <title id="jev-title">How a sale works with Jev</title>
  <desc id="jev-desc">The customer's message goes to the model, which only searches with guide. After each search, Jev answers typed questions: is it an order, which product, how many in total. When Jev is sure, the counter subtracts what is already sold, calls buy, and prints the receipt. If Jev is not sure, the model replies. If the customer asked something else or another product, the model is called again for just that. A plain sale takes one model call.</desc>
  <defs>
    <marker id="j-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#111"/>
    </marker>
  </defs>
  <g stroke="#111" stroke-width="1.5">
    <rect x="10" y="60" width="92" height="56" rx="4" fill="none"/>
    <rect x="118" y="60" width="92" height="56" rx="4" fill="#dbe8fa"/>
    <rect x="226" y="60" width="92" height="56" rx="4" fill="none"/>
    <rect x="334" y="60" width="92" height="56" rx="4" fill="#fbe3cf"/>
    <rect x="442" y="60" width="92" height="56" rx="4" fill="none"/>
    <rect x="550" y="60" width="92" height="56" rx="4" fill="none"/>
    <rect x="658" y="60" width="92" height="56" rx="4" fill="none"/>
    <rect x="550" y="176" width="200" height="56" rx="4" fill="#dbe8fa" stroke-dasharray="5 4"/>
    <rect x="226" y="176" width="200" height="56" rx="4" fill="#dbe8fa" stroke-dasharray="5 4"/>
  </g>
  <g fill="none" stroke="#111" stroke-width="1.5" marker-end="url(#j-arrow)">
    <line x1="102" y1="88" x2="114" y2="88"/>
    <line x1="210" y1="88" x2="222" y2="88"/>
    <line x1="318" y1="88" x2="330" y2="88"/>
    <line x1="426" y1="88" x2="438" y2="88"/>
    <line x1="534" y1="88" x2="546" y2="88"/>
    <line x1="642" y1="88" x2="654" y2="88"/>
    <line x1="380" y1="116" x2="380" y2="172" stroke-dasharray="5 4"/>
    <line x1="596" y1="116" x2="596" y2="172" stroke-dasharray="5 4"/>
    <line x1="704" y1="176" x2="704" y2="120" stroke-dasharray="5 4"/>
  </g>
  <g text-anchor="middle">
    <text x="56" y="84">customer</text>
    <text x="56" y="102">message</text>
    <text x="164" y="84">model</text>
    <text x="164" y="102" fill="#555">search</text>
    <text x="272" y="84">guide</text>
    <text x="272" y="102" fill="#555">rows</text>
    <text x="380" y="84">Jev</text>
    <text x="380" y="102" fill="#555">decides</text>
    <text x="488" y="84">buy</text>
    <text x="488" y="102" fill="#555">by code</text>
    <text x="596" y="84">receipt</text>
    <text x="596" y="102" fill="#555">printed</text>
    <text x="704" y="84">reply</text>
    <text x="326" y="200">model</text>
    <text x="326" y="218" fill="#555">replies</text>
    <text x="650" y="200">model</text>
    <text x="650" y="218" fill="#555">answers only the rest</text>
  </g>
  <text x="386" y="150" fill="#555" font-size="12">not sure</text>
  <text x="602" y="150" fill="#555" font-size="12">asked more?</text>
  <rect x="10" y="20" width="12" height="12" rx="2" fill="#dbe8fa" stroke="#111" stroke-width="1"/>
  <text x="30" y="30.5" fill="#333">model call, about 2 s</text>
  <rect x="250" y="20" width="12" height="12" rx="2" fill="#fbe3cf" stroke="#111" stroke-width="1"/>
  <text x="270" y="30.5" fill="#333">Jev decision, about 0.3 s</text>
  <text x="10" y="166" fill="#555">The model never sells.</text>
  <text x="10" y="186" fill="#555">A plain sale takes one</text>
  <text x="10" y="204" fill="#555">model call.</text>
  <text x="10" y="270" fill="#555">Jev reads how many the customer wants; code subtracts what is already sold.</text>
</svg>
